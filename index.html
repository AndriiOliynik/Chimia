<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ультимативний хімічний тренажер</title>
    <style>
        :root {
            --primary: #4a6fa5;
            --success: #2ec4b6;
            --danger: #e71d36;
            --bg: #f8f9fa;
            --card-bg: #ffffff;
            --text: #2b2d42;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            -webkit-tap-highlight-color: transparent;
        }
        .container {
            max-width: 100%;
            width: 480px;
            box-sizing: border-box;
        }
        h1 {
            text-align: center;
            color: var(--primary);
            font-size: 1.5rem;
            margin: 10px 0 5px 0;
        }
        .subtitle {
            text-align: center;
            color: #6c757d;
            font-size: 0.85rem;
            margin-bottom: 15px;
        }
        .progress-bar {
            background-color: #e9ecef;
            border-radius: 10px;
            height: 8px;
            width: 100%;
            margin-bottom: 15px;
            overflow: hidden;
        }
        .progress-fill {
            background-color: var(--primary);
            height: 100%;
            width: 4.54%;
            transition: width 0.3s;
        }
        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            margin-bottom: 15px;
            position: relative;
            box-sizing: border-box;
        }
        .badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background-color: #e2eafc;
            color: var(--primary);
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 0.75em;
            font-weight: bold;
        }
        .equation-block {
            margin: 15px 0;
            padding: 10px;
            border-left: 4px solid #ced4da;
            background: #f1f5f9;
            border-radius: 0 8px 8px 0;
            display: none;
        }
        .equation-block.active {
            display: block;
        }
        .equation-title {
            font-weight: bold;
            font-size: 0.85rem;
            color: #495057;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 5px;
        }
        .formula-row {
            font-size: 1.1rem;
            letter-spacing: 0.3px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 4px;
            line-height: 2.4;
        }
        .input-container {
            display: inline-flex;
            align-items: center;
            position: relative;
        }
        input[type="number"] {
            width: 34px;
            height: 28px;
            font-size: 1rem;
            text-align: center;
            border: 2px solid #cbd5e1;
            border-radius: 4px;
            outline: none;
            transition: all 0.2s;
            padding: 0;
            box-sizing: border-box;
        }
        input.index-input {
            width: 28px;
            height: 22px;
            font-size: 0.8rem;
            border: 2px solid #a5b4fc;
            background-color: #f5f3ff;
            margin-top: 8px;
            margin-left: -2px;
            margin-right: 2px;
        }
        input[type="number"]:focus {
            border-color: var(--primary);
            background-color: #fff;
        }
        input.correct {
            border-color: var(--success) !important;
            background-color: #d1fae5 !important;
            color: #065f46;
        }
        input.wrong {
            border-color: var(--danger) !important;
            background-color: #fee2e2 !important;
            color: #991b1b;
        }
        .btn-hint {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.1rem;
            padding: 0 3px;
            vertical-align: middle;
        }
        .hint-text {
            display: none;
            background-color: #fff3cd;
            border: 1px solid #ffeeba;
            color: #856404;
            padding: 10px;
            border-radius: 6px;
            margin-top: 8px;
            font-size: 0.85rem;
            line-height: 1.4;
        }
        .nav-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
            gap: 10px;
        }
        button.action-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            font-size: 0.9rem;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
            flex: 1;
            text-align: center;
        }
        button.action-btn:hover {
            background-color: #3a5a87;
        }
        button:disabled {
            background-color: #cccccc !important;
            cursor: not-allowed;
        }
        .success-banner {
            display: none;
            background-color: #d1fae5;
            color: #065f46;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            font-weight: bold;
            margin-top: 10px;
            font-size: 0.9rem;
        }
        sub, supr {
            font-size: 0.6em;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🧪 Хімічний Тренажер</h1>
    <div class="subtitle">Порожнє поле = коефіцієнт або індекс 1</div>
    
    <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
    </div>

    <div class="card">
        <div class="badge" id="taskCategory">Завантаження...</div>
        <h3 id="taskTitle" style="margin-top:0; margin-bottom:5px; font-size:1.1rem; color: var(--primary);">Задача</h3>
        <p id="taskDescription" style="font-weight: 500; font-size: 0.95rem; margin: 5px 0 15px 0; color: #495057;"></p>

        <!-- ЕТАП 1: Молекулярне рівняння з індексами -->
        <div class="equation-block active" id="block-mol">
            <div class="equation-title">
                <span>1. Молекулярне рівняння та індекси солі:</span>
                <button class="btn-hint" onclick="toggleHint('hint-mol')">💡</button>
            </div>
            <div class="formula-row" id="html-mol"></div>
            <div class="hint-text" id="hint-mol"></div>
        </div>

        <!-- ЕТАП 2: Повне йонне рівняння -->
        <div class="equation-block" id="block-full">
            <div class="equation-title">
                <span>2. Повний йонний вигляд:</span>
                <button class="btn-hint" onclick="toggleHint('hint-full')">💡</button>
            </div>
            <div class="formula-row" id="html-full"></div>
            <div class="hint-text" id="hint-full"></div>
        </div>

        <!-- ЕТАП 3: Скорочене йонне рівняння -->
        <div class="equation-block" id="block-short">
            <div class="equation-title">
                <span>3. Скорочений йонний вигляд:</span>
                <button class="btn-hint" onclick="toggleHint('hint-short')">💡</button>
            </div>
            <div class="formula-row" id="html-short"></div>
            <div class="hint-text" id="hint-short"></div>
        </div>

        <div class="success-banner" id="successBanner">🎉 Супер! Рівняння повністю розв'язано!</div>

        <div style="margin-top: 15px; text-align: right; display: flex;">
            <button class="action-btn" id="checkBtn" onclick="checkCurrentStep()">Перевірити рядок</button>
        </div>
    </div>

    <div class="nav-buttons">
        <button class="action-btn" id="prevBtn" onclick="changeTask(-1)" disabled>← Назад</button>
        <button class="action-btn" id="nextBtn" onclick="changeTask(1)">Вперед →</button>
    </div>
</div>

            short: "Фінальний крок нейтралізації: два йони водню та два гідроксид-іони збираються у дві молекули води (2, 2, 2)."
        },
        mol: { text: "[m0]Ca(OH)₂ + [m1]H₂SeO₄ → [m2]Ca[i0](SeO₄)[i1] + [m3]H₂O", ans: [1,1,1,2,1,1] },
        full: { text: "[f0]Ca²⁺ + [f1]OH⁻ + [f2]H⁺ + [f3]SeO₄²⁻ → [f4]Ca²⁺ + [f5]SeO₄²⁻ + [f6]H₂O", ans: [1,2,2,1,1,1,2] },
        short: { text: "[s0]H⁺ + [s1]OH⁻ → [s2]H₂O", ans: [2,2,2] }
    }
];

let currentTaskIdx = 0;
let currentStep = 'mol'; // 'mol', 'full', 'short'

function loadTask(idx) {
    const task = db[idx];
    currentStep = 'mol';
    
    document.getElementById("taskCategory").innerText = task.cat;
    document.getElementById("taskTitle").innerText = `Задача ${idx + 1} з ${db.length}`;
    document.getElementById("taskDescription").innerText = task.desc;
    
    document.getElementById("block-mol").classList.add("active");
    document.getElementById("block-full").classList.remove("active");
    document.getElementById("block-short").classList.remove("active");
    document.getElementById("successBanner").style.display = "none";
    document.getElementById("checkBtn").style.display = "inline-block";
    
    document.getElementById("hint-mol").style.display = "none";
    document.getElementById("hint-full").style.display = "none";
    document.getElementById("hint-short").style.display = "none";
    
    document.getElementById("hint-mol").innerText = task.hints.mol;
    document.getElementById("hint-full").innerText = task.hints.full;
    document.getElementById("hint-short").innerText = task.hints.short;
    
    renderFormula("html-mol", task.mol.text, "mol");
    renderFormula("html-full", task.full.text, "full");
    renderFormula("html-short", task.short.text, "short");
    
    document.getElementById("prevBtn").disabled = idx === 0;
    document.getElementById("nextBtn").disabled = idx === db.length - 1;
    
    document.getElementById("progressFill").style.width = `${((idx + 1) / db.length) * 100}%`;
}

function renderFormula(containerId, text, stepName) {
    const container = document.getElementById(containerId);
    container.innerHTML = "";
    
    // Розбиваємо текст за маркерами інпутів на кшталт [m0], [i1], [f2], [s0]
    const parts = text.split(/\[[mifsd]\d+\]/);
    const matches = text.match(/\[([mifsd])(\d+)\]/g);
    
    parts.forEach((part, i) => {
        let formattedPart = part
            .replace(/([A-Za-z\(\)])(\d+)/g, '$1<sub>$2</sub>')
            .replace(/(\d+)([\+\-])/g, '<sup>$1$2</sup>')
            .replace(/([\+\-])/g, '<sup>$1</sup>');
            
        const span = document.createElement("span");
        span.innerHTML = formattedPart;
        container.appendChild(span);
        
        if (matches && i < matches.length) {
            const match = matches[i];
            const isIndex = match.includes('i');
            
            const input = document.createElement("input");
            input.type = "number";
            input.inputMode = "numeric";
            input.pattern = "[0-9]*";
            input.min = "1";
            input.id = `input-${stepName}-${i}`;
            
            if (isIndex) {
                input.classList.add("index-input");
                input.placeholder = "1";
            } else {
                input.placeholder = "1";
            }
            container.appendChild(input);
        }
    });
}

function toggleHint(id) {
    const hint = document.getElementById(id);
    hint.style.display = hint.style.display === "block" ? "none" : "block";
}

function checkCurrentStep() {
    const task = db[currentTaskIdx];
    const stepData = task[currentStep];
    let allCorrect = true;
    
    for (let i = 0; i < stepData.ans.length; i++) {
        const input = document.getElementById(`input-${currentStep}-${i}`);
        let userVal = parseInt(input.value);
        if (isNaN(userVal)) {
            userVal = 1; // Якщо поле порожнє, вважаємо його за 1
        }
        
        if (userVal === stepData.ans[i]) {
            input.classList.remove("wrong");
            input.classList.add("correct");
            input.disabled = true;
        } else {
            input.classList.add("wrong");
            allCorrect = false;
        }
    }
    
    if (allCorrect) {
        if (currentStep === 'mol') {
            currentStep = 'full';
            document.getElementById("block-full").classList.add("active");
            document.getElementById("block-full").scrollIntoView({ behavior: 'smooth' });
        } else if (currentStep === 'full') {
            currentStep = 'short';
            document.getElementById("block-short").classList.add("active");
            document.getElementById("block-short").scrollIntoView({ behavior: 'smooth' });
        } else if (currentStep === 'short') {
            document.getElementById("successBanner").style.display = "block";
            document.getElementById("checkBtn").style.display = "none";
        }
    }
}

function changeTask(dir) {
    currentTaskIdx += dir;
    if (currentTaskIdx < 0) currentTaskIdx = 0;
    if (currentTaskIdx >= db.length) currentTaskIdx = db.length - 1;
    loadTask(currentTaskIdx);
}

loadTask(0);
</script>
